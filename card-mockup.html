<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LUMEN — Tarot Card Draft Mockup</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Outfit:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --font-display: 'Cormorant Garamond', Georgia, serif;
        --font-sans: 'Outfit', system-ui, sans-serif;
        --cyan: #5df7eb;
        --gold: #ffd97d;
        --violet: #c58cff;
        --mint: #6ef5c8;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html {
        font-size: clamp(16px, 0.5vw + 0.5vh + 4px, 27px);
      }
      body {
        min-height: 100vh;
        font-family: var(--font-sans);
        color: #f2fbff;
        background:
          radial-gradient(circle at 22% 28%, rgba(45, 22, 86, 0.42), transparent 46%),
          radial-gradient(circle at 78% 68%, rgba(16, 86, 118, 0.34), transparent 50%),
          radial-gradient(circle at 50% 45%, #09142b 0%, #030611 72%);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 2.2rem 1.5rem 2.8rem;
        overflow-x: hidden;
      }

      /* Floating mockup switcher bar */
      .mockup-bar {
        position: fixed;
        top: 14px;
        right: 16px;
        z-index: 30;
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        background: rgba(5, 10, 24, 0.84);
        border: 1px solid rgba(93, 247, 235, 0.24);
        padding: 6px 10px;
        border-radius: 999px;
        backdrop-filter: blur(10px);
      }
      .m-btn {
        border: 1px solid rgba(93, 247, 235, 0.24);
        background: rgba(15, 28, 56, 0.7);
        color: #d7f2ff;
        font: 600 0.68rem var(--font-sans);
        letter-spacing: 0.08em;
        padding: 5px 11px;
        border-radius: 999px;
        cursor: pointer;
        transition: all 0.16s ease;
      }
      .m-btn:hover, .m-btn.active {
        border-color: var(--cyan);
        background: rgba(93, 247, 235, 0.2);
        color: #fff;
      }
      .m-btn.is-banish.active {
        border-color: #ff5d87;
        background: rgba(255, 75, 118, 0.24);
        color: #ffd0dc;
      }

      /* Frameless Draft Header */
      .draft-wrap {
        width: min(94vw, 68rem);
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      .draft-eyebrow {
        display: flex;
        align-items: center;
        gap: 0.9rem;
        font-size: 0.92rem;
        font-weight: 700;
        letter-spacing: 0.24em;
        color: var(--cyan);
        text-transform: uppercase;
        text-shadow: 0 0 18px rgba(93, 247, 235, 0.55);
      }
      .draft-eyebrow::before,
      .draft-eyebrow::after {
        content: '';
        width: clamp(32px, 5vw, 76px);
        height: 1px;
        background: linear-gradient(90deg, transparent, rgba(93, 247, 235, 0.75), transparent);
      }
      .draft-title {
        font-family: var(--font-display);
        font-size: clamp(2.1rem, 3.6vw, 3.3rem);
        font-weight: 600;
        letter-spacing: 0.03em;
        color: #f8fdff;
        margin: 0.25rem 0 1.65rem;
        text-shadow: 0 4px 26px rgba(93, 247, 235, 0.22);
      }

      /* 3-Card Tarot Grid */
      .tarot-grid {
        width: 100%;
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: clamp(16px, 2.2vw, 34px);
        align-items: stretch;
      }

      /* Individual Celestial Tarot Card */
      .tarot-card {
        --frame: #5df7eb;
        --frame-soft: rgba(93, 247, 235, 0.42);
        --glow: rgba(93, 247, 235, 0.28);
        --bg-top: #071b33;
        --bg-bot: #040a1a;
        --pill-bg: rgba(93, 247, 235, 0.14);
        --pill-txt: #c4fff9;
        --accent: #6ef5ff;

        position: relative;
        display: flex;
        flex-direction: column;
        padding: 1.45rem 1.35rem 1.35rem;
        min-height: clamp(390px, 52vh, 560px);
        border-radius: 1.15rem;
        border: 2px solid var(--frame);
        background:
          radial-gradient(circle at 50% 28%, var(--glow) 0%, transparent 56%),
          linear-gradient(180deg, var(--bg-top) 0%, var(--bg-bot) 100%);
        box-shadow:
          0 16px 44px rgba(0, 0, 0, 0.62),
          0 0 26px var(--glow),
          inset 0 0 24px rgba(255, 255, 255, 0.04);
        cursor: pointer;
        text-align: left;
        color: #f5fbff;
        font-family: inherit;
        transition: transform 0.22s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.22s ease, border-color 0.22s ease;
      }

      /* Inner filigree hairline border */
      .tarot-card::before {
        content: '';
        position: absolute;
        inset: 7px;
        border-radius: 0.85rem;
        border: 1px solid var(--frame-soft);
        pointer-events: none;
      }

      /* Top-center celestial star crest */
      .card-crest {
        position: absolute;
        top: -12px;
        left: 50%;
        transform: translateX(-50%);
        width: 26px;
        height: 26px;
        display: grid;
        place-items: center;
        color: var(--frame);
        filter: drop-shadow(0 0 8px var(--frame));
        pointer-events: none;
      }
      .card-crest::before {
        content: '';
        position: absolute;
        width: 18px;
        height: 18px;
        background: var(--bg-top);
        border: 1.5px solid var(--frame);
        border-radius: 4px;
        transform: rotate(45deg);
        z-index: -1;
      }

      /* Corner star glints */
      .corner-star {
        position: absolute;
        width: 14px;
        height: 14px;
        color: var(--frame);
        opacity: 0.9;
        filter: drop-shadow(0 0 5px var(--frame));
        pointer-events: none;
      }
      .corner-star.tl { top: 10px; left: 10px; }
      .corner-star.tr { top: 10px; right: 10px; }
      .corner-star.bl { bottom: 10px; left: 10px; }
      .corner-star.br { bottom: 10px; right: 10px; }

      .tarot-card:hover {
        transform: translateY(-7px) scale(1.018);
        box-shadow:
          0 24px 58px rgba(0, 0, 0, 0.72),
          0 0 42px var(--glow),
          inset 0 0 30px rgba(255, 255, 255, 0.08);
      }
      .tarot-card:hover .astrolabe-ring {
        animation-duration: 9s;
        opacity: 0.92;
      }
      .tarot-card:hover .spell-icon-svg {
        transform: scale(1.08);
      }

      /* Rarity Themes */
      .tarot-card--common {
        --frame: #7ea8c9;
        --frame-soft: rgba(145, 185, 218, 0.36);
        --glow: rgba(126, 168, 201, 0.22);
        --bg-top: #0b182c;
        --bg-bot: #050a16;
        --pill-bg: rgba(145, 185, 218, 0.16);
        --pill-txt: #d5e8f8;
        --accent: #9cc6e8;
      }
      .tarot-card--uncommon {
        --frame: #52f0c4;
        --frame-soft: rgba(82, 240, 196, 0.42);
        --glow: rgba(82, 240, 196, 0.28);
        --bg-top: #07262a;
        --bg-bot: #040d16;
        --pill-bg: rgba(82, 240, 196, 0.16);
        --pill-txt: #b3ffe8;
        --accent: #70f7cf;
      }
      .tarot-card--rare {
        --frame: #46d8ff;
        --frame-soft: rgba(70, 216, 255, 0.48);
        --glow: rgba(70, 216, 255, 0.34);
        --bg-top: #06213d;
        --bg-bot: #040919;
        --pill-bg: rgba(70, 216, 255, 0.18);
        --pill-txt: #c4f2ff;
        --accent: #5fe2ff;
      }
      .tarot-card--epic {
        --frame: #ffca57;
        --frame-soft: rgba(255, 202, 87, 0.48);
        --glow: rgba(182, 92, 255, 0.42);
        --bg-top: #26103e;
        --bg-bot: #0b071b;
        --pill-bg: rgba(154, 78, 255, 0.28);
        --pill-txt: #f5d8ff;
        --accent: #ffd97d;
      }

      /* Banish Mode Hover */
      .tarot-grid.is-banish .tarot-card:hover {
        --frame: #ff4d79;
        --glow: rgba(255, 77, 121, 0.45);
        border-color: #ff4d79;
      }

      /* Hero Spell Medallion */
      .medallion {
        position: relative;
        width: 100%;
        height: clamp(136px, 19vh, 210px);
        display: grid;
        place-items: center;
        margin: 0.25rem 0 0.75rem;
      }
      .astrolabe-ring {
        position: absolute;
        width: clamp(124px, 16.5vh, 186px);
        height: clamp(124px, 16.5vh, 186px);
        color: var(--frame);
        opacity: 0.56;
        animation: spinSlow 24s linear infinite;
        transition: opacity 0.25s ease;
      }
      .spell-icon-svg {
        position: relative;
        z-index: 2;
        width: clamp(82px, 11vh, 124px);
        height: clamp(82px, 11vh, 124px);
        color: var(--frame);
        filter: drop-shadow(0 0 14px var(--frame)) drop-shadow(0 0 28px var(--glow));
        transition: transform 0.22s cubic-bezier(0.22, 1, 0.36, 1);
      }
      @keyframes spinSlow {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }

      /* Centered Pill Row */
      .pill-row {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.45rem;
        margin-bottom: 0.85rem;
      }
      .pill {
        font-size: 0.84rem;
        font-weight: 700;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        padding: 0.24rem 0.74rem;
        border-radius: 999px;
        background: var(--pill-bg);
        border: 1px solid var(--frame-soft);
        color: var(--pill-txt);
      }
      .pill-key {
        min-width: 1.75rem;
        text-align: center;
        padding: 0.24rem 0.54rem;
        color: #fff;
        background: rgba(255, 255, 255, 0.08);
      }

      /* Ability Name + Display Title + Desc */
      .ability-eyebrow {
        display: flex;
        align-items: center;
        gap: 0.44rem;
        font-size: 0.88rem;
        font-weight: 700;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--accent);
        margin-bottom: 0.24rem;
      }
      .card-title {
        font-family: var(--font-display);
        font-size: clamp(1.95rem, 2.6vw, 2.65rem);
        font-weight: 700;
        line-height: 1.08;
        color: #ffffff;
        margin-bottom: 0.6rem;
      }
      .card-desc {
        font-size: 1.12rem;
        line-height: 1.48;
        color: rgba(230, 244, 255, 0.9);
        margin-bottom: 1rem;
      }

      /* Star Hairline Divider & Synergy Footer */
      .card-footer {
        margin-top: auto;
        padding-top: 0.4rem;
        text-align: center;
      }
      .star-divider {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.6rem;
        margin-bottom: 0.6rem;
        color: var(--frame);
        font-size: 0.82rem;
      }
      .star-divider::before,
      .star-divider::after {
        content: '';
        flex: 1;
        height: 1px;
        background: linear-gradient(90deg, transparent, var(--frame-soft), transparent);
      }
      .synergy-text {
        font-size: 0.94rem;
        font-weight: 600;
        line-height: 1.38;
        color: var(--accent);
      }
      .tarot-card--epic .synergy-text {
        color: #d6a4ff;
      }

      /* Bottom Controls */
      .draft-actions {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: center;
        gap: 0.9rem;
        margin-top: 1.55rem;
      }
      .action-pill {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.64rem 1.45rem;
        border-radius: 999px;
        border: 1.5px solid rgba(93, 247, 235, 0.65);
        background: linear-gradient(135deg, rgba(10, 32, 58, 0.9), rgba(5, 14, 30, 0.95));
        color: #e8fcff;
        font: 700 0.9rem var(--font-sans);
        letter-spacing: 0.13em;
        cursor: pointer;
        box-shadow: 0 0 20px rgba(93, 247, 235, 0.2);
        transition: all 0.16s ease;
      }
      .action-pill:hover {
        transform: translateY(-2px);
        box-shadow: 0 0 28px rgba(93, 247, 235, 0.36);
      }
      .action-pill.banish {
        border-color: rgba(255, 93, 135, 0.62);
        color: #ffd0dc;
        box-shadow: 0 0 18px rgba(255, 75, 118, 0.18);
      }
      .draft-hint {
        font-size: 0.84rem;
        letter-spacing: 0.15em;
        color: rgba(186, 214, 236, 0.72);
        text-transform: uppercase;
      }

      @media (max-width: 820px) {
        .tarot-grid { grid-template-columns: 1fr; max-width: 400px; }
        .tarot-card { min-height: auto; }
      }

      /* Side-by-Side Old vs New Icon Comparison Grid */
      .compare-grid {
        width: 100%;
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(22rem, 1fr));
        gap: 1.15rem;
      }
      .compare-card {
        border: 1px solid rgba(93, 247, 235, 0.28);
        border-radius: 1rem;
        background: linear-gradient(180deg, rgba(10, 24, 48, 0.88), rgba(4, 10, 24, 0.95));
        padding: 1rem 1.15rem 1.15rem;
        box-shadow: 0 12px 30px rgba(0, 0, 0, 0.45);
      }
      .compare-name {
        font-family: var(--font-display);
        font-size: 1.45rem;
        font-weight: 700;
        color: #fff;
        text-align: center;
        margin-bottom: 0.75rem;
        letter-spacing: 0.03em;
      }
      .compare-pair {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0.8rem;
      }
      .compare-slot {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 0.9rem 0.6rem 0.75rem;
        border-radius: 0.8rem;
        border: 1px solid rgba(255, 255, 255, 0.1);
        background: radial-gradient(circle at 50% 45%, rgba(93, 247, 235, 0.14), rgba(3, 8, 20, 0.9) 70%);
      }
      .compare-slot.is-new {
        border-color: rgba(255, 202, 87, 0.45);
        background: radial-gradient(circle at 50% 45%, rgba(168, 92, 255, 0.22), rgba(10, 6, 24, 0.92) 72%);
      }
      .compare-slot .mini-medallion {
        position: relative;
        width: 6.4rem;
        height: 6.4rem;
        display: grid;
        place-items: center;
        color: #5df7eb;
      }
      .compare-slot.is-new .mini-medallion {
        color: #ffca57;
      }
      .compare-slot .astrolabe-ring {
        width: 6.2rem;
        height: 6.2rem;
      }
      .compare-slot .spell-icon-svg,
      .compare-slot .old-icon-svg svg {
        position: relative;
        z-index: 2;
        width: 3.8rem;
        height: 3.8rem;
        filter: drop-shadow(0 0 10px currentColor);
      }
      .compare-label {
        margin-top: 0.55rem;
        font-size: 0.72rem;
        font-weight: 700;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: rgba(190, 224, 244, 0.76);
      }
      .compare-slot.is-new .compare-label {
        color: #ffd97d;
      }
    </style>
  </head>
  <body>
    <div class="mockup-bar" id="mockup-bar">
      <button class="m-btn active" id="btn-compare-icons">Old vs New Icons (11)</button>
      <button class="m-btn" data-set="0">Set 1 (Mockup)</button>
      <button class="m-btn" data-set="1">Set 2</button>
      <button class="m-btn" data-set="2">Set 3</button>
      <button class="m-btn" data-set="3">Set 4</button>
      <button class="m-btn is-banish" id="btn-banish-demo">Banish Hover</button>
    </div>

    <div class="draft-wrap">
      <div class="draft-eyebrow" id="draft-eyebrow">✦ Icon Comparison ✦</div>
      <h1 class="draft-title" id="draft-title">Old vs. New Spell Icons</h1>
      <div class="tarot-grid" id="tarot-grid"></div>
      <div class="compare-grid" id="compare-grid" style="display:none"></div>
      <div class="draft-actions" id="draft-actions">
        <button class="action-pill" id="btn-reroll-demo">↻ REROLL (2)</button>
        <button class="action-pill banish" id="btn-banish-pill">✕ BANISH (1)</button>
        <span class="draft-hint">Press 1, 2 or 3 · Hover abilities for modifiers</span>
      </div>
    </div>

    <script type="module">
      import { ABILITY_ICONS } from '/src/views/dom/DomIcons.js';
      const STAR_SVG = `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 1l2.7 8.3L23 12l-8.3 2.7L12 23l-2.7-8.3L1 12l8.3-2.7z"/></svg>`;

      const ASTROLABE_SVG = `
        <svg class="astrolabe-ring" viewBox="0 0 200 200" fill="none" stroke="currentColor">
          <circle cx="100" cy="100" r="88" stroke-width="0.9" stroke-dasharray="3 6" opacity="0.55"/>
          <circle cx="100" cy="100" r="74" stroke-width="1.3" opacity="0.72"/>
          <circle cx="100" cy="100" r="56" stroke-width="0.8" stroke-dasharray="10 6" opacity="0.5"/>
          <path d="M100 10v14M100 176v14M10 100h14M176 100h14" stroke-width="1.4" opacity="0.8"/>
          <path d="M36 36l9 9M155 155l9 9M164 36l-9 9M45 155l-9 9" stroke-width="1" opacity="0.55"/>
          <circle cx="100" cy="26" r="2.6" fill="currentColor"/>
          <circle cx="100" cy="174" r="2.6" fill="currentColor"/>
          <circle cx="26" cy="100" r="2.6" fill="currentColor"/>
          <circle cx="174" cy="100" r="2.6" fill="currentColor"/>
        </svg>`;

      // Bespoke high-detail layered spell emblems for all 11 abilities
      const SPELL_EMBLEMS = {
        resonant_volley: `<svg class="spell-icon-svg" viewBox="0 0 120 120" fill="none">
          <!-- Blazing 3-bolt starlight salvo -->
          <path d="M16 98L82 32" stroke="currentColor" stroke-width="11" stroke-linecap="round" opacity="0.22"/>
          <path d="M16 98L82 32" stroke="currentColor" stroke-width="4.5" stroke-linecap="round" opacity="0.85"/>
          <path d="M28 106L94 48" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" opacity="0.55"/>
          <path d="M12 80L66 20" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" opacity="0.55"/>
          <path d="M84 18L90 32L104 38L90 44L84 58L78 44L64 38L78 32Z" fill="#fff"/>

          <circle cx="54" cy="86" r="2.2" fill="currentColor"/>
        </svg>`,
        solar_orbitals: `<svg class="spell-icon-svg" viewBox="0 0 120 120" fill="none">
          <!-- Clean luminous orbit ring + 2 sleek crystal diamond blades -->
          <ellipse cx="60" cy="60" rx="44" ry="26" transform="rotate(-24 60 60)" stroke="currentColor" stroke-width="2.2" opacity="0.55"/>
          <path d="M22 76C14 58 34 36 62 32" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" opacity="0.9"/>
          <path d="M98 44C106 62 86 84 58 88" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" opacity="0.9"/>
          <path d="M22 66L31 74L22 86L13 74Z" fill="#fff"/>
          <path d="M98 34L107 46L98 54L89 46Z" fill="#fff"/>
          <path d="M60 47L63.5 56.5L73 60L63.5 63.5L60 73L56.5 63.5L47 60L56.5 56.5Z" fill="#fff" opacity="0.95"/>
        </svg>`,
        voltaic_chain: `<svg class="spell-icon-svg" viewBox="0 0 120 120" fill="none">
          <!-- Pure sleek bioluminescent lightning bolt -->
          <path d="M68 14L34 62H58L46 106L88 54H62L68 14Z" stroke="currentColor" stroke-width="10" stroke-linejoin="round" opacity="0.22"/>
          <path d="M68 14L34 62H58L46 106L88 54H62L68 14Z" fill="currentColor" fill-opacity="0.22" stroke="currentColor" stroke-width="2.8" stroke-linejoin="round"/>
          <path d="M65 22L41 58H60L51 96L80 58H61L65 22Z" fill="#fff"/>
        </svg>`,
        astral_pulse: `<svg class="spell-icon-svg" viewBox="0 0 120 120" fill="none">
          <!-- Clean expanding bioluminescent nova rings -->
          <circle cx="60" cy="60" r="44" stroke="currentColor" stroke-width="2" opacity="0.38"/>
          <circle cx="60" cy="60" r="30" stroke="currentColor" stroke-width="4.5" opacity="0.32"/>
          <circle cx="60" cy="60" r="30" stroke="currentColor" stroke-width="2.2" opacity="0.95"/>
          <circle cx="60" cy="60" r="16" stroke="#fff" stroke-width="1.8" opacity="0.85"/>
          <path d="M60 40L64 56L80 60L64 64L60 80L56 64L40 60L56 56Z" fill="#fff"/>
        </svg>`,
        seeker_barrage: `<svg class="spell-icon-svg" viewBox="0 0 120 120" fill="none">
          <!-- 3 curved homing crystal needles banking into a target -->
          <path d="M18 96C20 56 46 32 88 26" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"/>
          <path d="M24 106C46 84 68 62 96 42" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" opacity="0.8"/>
          <path d="M14 70C30 40 52 24 76 18" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" opacity="0.65"/>
          <!-- Sleek crystalline needle heads -->
          <path d="M74 18L102 22L82 38L84 26Z" fill="#fff" stroke="currentColor" stroke-width="1.4"/>
          <path d="M84 36L108 38L92 54L92 43Z" fill="#fff" stroke="currentColor" stroke-width="1.3"/>
          <path d="M62 12L86 14L70 28L71 19Z" fill="#fff" opacity="0.9"/>
          <!-- Target reticle -->

      const titleEl = document.getElementById('draft-title');
      const compareBtn = document.getElementById('btn-compare-icons');

      const ABILITY_LIST = [
        { id: 'resonant_volley', name: 'Starlight Bolt' },
        { id: 'solar_orbitals', name: 'Orbiting Blades' },
        { id: 'voltaic_chain', name: 'Voltaic Arc' },
        { id: 'astral_pulse', name: 'Astral Pulse' },

        { id: 'starbloom_spores', name: 'Starbloom Spores' },
        { id: 'celestial_spear', name: 'Celestial Spear' },
        { id: 'gravity_harvest', name: 'Gravity Harvest' },
        { id: 'aegis_bloom', name: 'Aegis Sanctuary' },
        { id: 'astral_shield', name: 'Starlight Shield' },
        { id: 'echo_conduit', name: 'Chrono Conduit' },
      ];

      function renderCompare() {
        document.querySelectorAll('[data-set]').forEach((b) => b.classList.remove('active'));
        compareBtn.classList.add('active');
        eyebrowEl.textContent = '✦ Icon Comparison (All 11) ✦';
        titleEl.textContent = 'Old vs. New Spell Icons';
        grid.style.display = 'none';
        actionsEl.style.display = 'none';
        compareGrid.style.display = 'grid';

        compareGrid.innerHTML = ABILITY_LIST.map(
          (ab) => `
          <div class="compare-card">
            <div class="compare-name">${ab.name}</div>
            <div class="compare-pair">
              <div class="compare-slot">
                <div class="mini-medallion">
                  ${ASTROLABE_SVG}
                  <span class="old-icon-svg">${ABILITY_ICONS[ab.id] || ''}</span>
                </div>
                <span class="compare-label">Old Icon</span>
              </div>
              <div class="compare-slot is-new">
                <div class="mini-medallion">
                  ${ASTROLABE_SVG}
                  ${SPELL_EMBLEMS[ab.id] || ''}
                </div>
                <span class="compare-label">New Emblem</span>
              </div>
            </div>
          </div>`
        ).join('');
      }

      function renderSet(idx) {
        activeSet = idx;
        compareBtn.classList.remove('active');
        document.querySelectorAll('[data-set]').forEach((b) =>
          b.classList.toggle('active', Number(b.dataset.set) === idx)
        );
        eyebrowEl.textContent = '✦ Resonance Level 2 ✦';
        titleEl.textContent = 'Choose an Ability Card';
        compareGrid.style.display = 'none';
        grid.style.display = 'grid';
        actionsEl.style.display = 'flex';
        grid.innerHTML = CARD_SETS[idx]
          .map(
            (c, i) => `
          <button class="tarot-card tarot-card--${c.rarity}" type="button">
            <span class="card-crest">${STAR_SVG}</span>
            <span class="corner-star tl">${STAR_SVG}</span>
            <span class="corner-star tr">${STAR_SVG}</span>
            <span class="corner-star bl">${STAR_SVG}</span>
            <span class="corner-star br">${STAR_SVG}</span>

            <div class="medallion">
              ${ASTROLABE_SVG}
              ${SPELL_EMBLEMS[c.id]}
            </div>

            <div class="pill-row">
              <span class="pill">${c.badge}</span>
              <span class="pill">${c.rank}</span>
              <span class="pill pill-key">${i + 1}</span>
            </div>

            <div class="ability-eyebrow"><span>✦</span> ${c.name}</div>
            <div class="card-title">${c.title}</div>
            <div class="card-desc">${c.desc}</div>

            <div class="card-footer">
              <div class="star-divider">✦</div>
              <div class="synergy-text">${c.footer}</div>
            </div>
          </button>`
          )
          .join('');
      }

      compareBtn.addEventListener('click', renderCompare);
      document.querySelectorAll('[data-set]').forEach((btn) =>
        btn.addEventListener('click', () => renderSet(Number(btn.dataset.set)))
      );
      document.getElementById('btn-reroll-demo').addEventListener('click', () => {
        renderSet((activeSet + 1) % CARD_SETS.length);
      });
      const toggleBanish = () => {
        grid.classList.toggle('is-banish');
        document.getElementById('btn-banish-demo').classList.toggle('active', grid.classList.contains('is-banish'));
      };
      document.getElementById('btn-banish-demo').addEventListener('click', toggleBanish);
      document.getElementById('btn-banish-pill').addEventListener('click', toggleBanish);

      renderCompare();
    </script>
